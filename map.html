<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>map</title>
    <!-- font link -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Exo+2:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <!-- css link -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/adaptive.css">

</head>

<body>
    <div class="cursor">
        <img class="cursor__play" src="images/play.svg" alt="">
    </div>

    <div class="cursor-trail"></div>

    <header class="header__map">
        <div class="container">
            <div class="header__content">
                <div class="header__top">
                    <a href="search.html" class="logo">
                        <span class="logo__main">VORSÉ</span>
                        <span class="logo__sub">Private residences</span>
                    </a>
                    <nav class="menu">


                        <ul class="menu__list">
                            <li class="menu__item "><a href="index.html" class="menu__link link--color">Home</a></li>
                            <li class="menu__item"><a href="page-blackwood.html"
                                    class="menu__link link--color">Properties</a></li>
                            <li class="menu__item"><a href="search.html" class="menu__link link--color">Search</a></li>
                            <li class="menu__item"><a href="#press" class="menu__link link--color">Press</a></li>
                            <li class="menu__item"><a href="#explore" class="menu__link link--color">estates</a></li>
                        </ul>
                    </nav>
                    <button class="burger" aria-label="Toggle menu" aria-expanded="false">

                        <span class="burger__line"></span>
                        <span class="burger__line"></span>
                    </button>

                </div>
            </div>
        </div>
    </header>
    <section class="filter-map">
        <div class="container">
            <h1 class="page__title title__map">map</h1>


            <div class="filters">
                <div class="filter">
                    <label>Property type</label>
                    <select>
                        <option>VILLAS</option>
                        <option>APARTMENTS</option>
                        <option>HOUSES</option>
                    </select>
                </div>

                <div class="filter">
                    <label>Country, State, City, Postal code</label>
                    <input type="text" placeholder="COUNTRY, STATE, CITY, POSTAL CODE">
                </div>

                <div class="filter">
                    <label>Price</label>
                    <select>
                        <option>$50K - $70K</option>
                        <option>$70K - $100K</option>
                        <option>$100K - $300K</option>
                        <option>$300K+</option>
                    </select>
                </div>

                <div class="filter">
                    <label>Bed</label>
                    <select>
                        <option>3-6</option>

                    </select>
                </div>
            </div>
            <div class="map-btn-group">
                <button class="map-btn map-pages--map">SHOW MAP</button>
                <button class="hide-filters-btn">SHOW FILTERS</button>
            </div>
        </div>
    </section>

    <!-- section map -->

    <section class="map-section">

        <div class="map-section__bg">


            <div class="map-point">
                <div class="map-dot"></div>

                <div class="map__card">

                    <div class="card">

                        <img src="images/residences-card-2.webp" alt="">

                        <a href="#">

                            <div class="card__content">

                                <h3>Black Monolith</h3>

                                <p class="card-map__meta">
                                    <span class="card__meta-opacity-50">540</span>
                                    <span class="card__meta-opacity-80">m²</span>

                                    <span class="card__meta-opacity-50">• 5</span>
                                    <span class="card__meta-opacity-80">Beds</span>

                                    <br>

                                    <span class="card__location">
                                        Noho, New York
                                    </span>
                                </p>

                                <div class="card__price">
                                    <span class="card__price-opacity-80">
                                        From:
                                    </span>

                                    <span>$19.5M</span>
                                </div>

                            </div>

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <script src="js/common.js"></script>
</body>
