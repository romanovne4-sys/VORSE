    <link rel="stylesheet" href="css/adaptive.css">

</head>

<body>

    <header class="header__map">
        <div class="container">
            <div class="header__content">
                <div class="header__top">
                    <a href="#" class="logo">
                        <span class="logo__main">VORSÉ</span>
                        <span class="logo__sub">Private residences</span>
                    </a>
                    <nav class="menu">


                        <ul class="menu__list">
                            <li class="menu__item "><a href="/" class="menu__link">Team</a></li>
                            <li class="menu__item"><a href="#" class="menu__link">Properties</a></li>
                            <li class="menu__item"><a href="search.html" class="menu__link">Search</a></li>
                            <li class="menu__item"><a href="#press" class="menu__link">Press</a></li>
                            <li class="menu__item"><a href="#explore" class="menu__link">estates</a></li>
                        </ul>
                    </nav>
                    <button class="burger" aria-label="Toggle menu" aria-expanded="false">
                       
                        <span class="burger__line"></span>
                        <span class="burger__line"></span>
                    </button>

                </div>
            </div>
        </div>
    </header>
    <section class="filter-map">
        <div class="container">
            <h1 class="search__title page__title">map</h1>

            <div class="filters filters__map">
                <div class="filter">
                    <label>Property type</label>
                    <select>
            <option>VILLAS</option>
            <option>APARTMENTS</option>
            <option>HOUSES</option>
        </select>
                </div>

                <div class="filter">
                    <label>Country, State, City, Postal code</label>
                    <input type="text" placeholder="COUNTRY, STATE, CITY, POSTAL CODE">
                </div>

                <div class="filter">
                    <label>Price</label>
                    <select>
            <option>$50K - $70K</option>
            <option>$70K - $100K</option>
            <option>$100K - $300K</option>
            <option>$300K+</option>
        </select>
                </div>

                <div class="filter">
                    <label>Bed</label>
                    <select>
            <option>3-6</option>
         
        </select>
                </div>
            </div>
            <button class="map-btn">SHOW MAP</button>
        </div>
    </section>

    <!-- section map -->
    <section class="map-section">
        <div class="map-section__bg">

            <div class="map-section__content">
                <div class="card-map">
                    <img src="images/residences-card-2.webp" alt="">
                    <a href="#">
                        <div class="card-map__content">

                            <h3>Black Monolith</h3>
                            <p class="card-map__meta">
                                <span class="card-map__meta-opacity-50">540</span>
                                <span class="card-map__meta-opacity-80">m²</span>
                                <span class="card-map__meta-opacity-50">• 5</span>
                                <span class="card-map__meta-opacity-80">Beds</span><br>
                                <span class="card-map__location">Noho, New York</span>
                            </p>
                            <div class="card-map__price">
                                <span class="card-map__price-opacity-80">From:</span>
                                <span>$19.5M</span>
                            </div>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </section>
